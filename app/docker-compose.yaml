name: day-ahead-forecast
services:
  influxdb:
    container_name: influxdb
    image: influxdb:2.7
    ports:
      - 8086:8086
    restart: on-failure:5
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-local-influxdb-password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-kirchdorf}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-energy}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?export INFLUXDB_TOKEN before running docker compose up}
    healthcheck:
      test:
        - CMD-SHELL
        - influx bucket list --host http://localhost:8086 --org "$$DOCKER_INFLUXDB_INIT_ORG" --token "$$DOCKER_INFLUXDB_INIT_ADMIN_TOKEN" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    volumes:
      - type: volume
        source: influxdb2-data
        target: /var/lib/influxdb2
      - type: volume
        source: influxdb2-config
        target: /etc/influxdb2
  backend:
    container_name: forecast-backend
    profiles:
      - server
    image: day-ahead-forecast-backend
    build:
      context: ./quarkus
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      ENERGY_INFLUX_URL: http://influxdb:8086
      ENERGY_INFLUX_ORG: ${INFLUXDB_ORG:-kirchdorf}
      ENERGY_INFLUX_BUCKET: ${INFLUXDB_BUCKET:-energy}
      ENERGY_INFLUX_MEASUREMENT: energy_values
      ENERGY_INFLUX_FORECAST_MEASUREMENT: energy_forecasts
      ENERGY_INFLUX_FORECAST_EVALUATION_MEASUREMENT: forecast_evaluations
      ENERGY_INFLUX_FORECAST_RUN_METADATA_MEASUREMENT: forecast_run_metadata
      ENERGY_INFLUX_TOKEN: ${INFLUXDB_TOKEN:?export INFLUXDB_TOKEN before running docker compose up}
    depends_on:
      influxdb:
        condition: service_healthy
  importer:
    profiles:
      - import
    image: day-ahead-forecast-backend
    build:
      context: ./quarkus
      dockerfile: Dockerfile
    environment:
      ENERGY_INFLUX_URL: http://influxdb:8086
      ENERGY_INFLUX_ORG: ${INFLUXDB_ORG:-kirchdorf}
      ENERGY_INFLUX_BUCKET: ${INFLUXDB_BUCKET:-energy}
      ENERGY_INFLUX_MEASUREMENT: energy_values
      ENERGY_INFLUX_TOKEN: ${INFLUXDB_TOKEN:?export INFLUXDB_TOKEN before running docker compose up}
      ENERGY_IMPORT_WRITE_BATCH_SIZE: ${ENERGY_IMPORT_WRITE_BATCH_SIZE:-5000}
      ENERGY_IMPORT_GZIP_THRESHOLD_BYTES: ${ENERGY_IMPORT_GZIP_THRESHOLD_BYTES:-1048576}
    volumes:
      - type: bind
        source: ./quarkus/data/csv_Archiv
        target: /import-data
        read_only: true
    depends_on:
      influxdb:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        java \
          -Dquarkus.http.host=127.0.0.1 \
          -Dquarkus.http.port=0 \
          -Denergy.influx.token="$$ENERGY_INFLUX_TOKEN" \
          -Denergy.influx.url="$$ENERGY_INFLUX_URL" \
          -Denergy.influx.org="$$ENERGY_INFLUX_ORG" \
          -Denergy.influx.bucket="$$ENERGY_INFLUX_BUCKET" \
          -Denergy.influx.write-batch-size="$$ENERGY_IMPORT_WRITE_BATCH_SIZE" \
          -Denergy.influx.gzip-threshold-bytes="$$ENERGY_IMPORT_GZIP_THRESHOLD_BYTES" \
          -Denergy.import.command.directory=/import-data \
          -jar /deployments/quarkus-run.jar
  forecast-runner:
    profiles:
      - forecasts
    image: day-ahead-forecast-python
    build:
      context: .
      dockerfile: python/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      - type: bind
        source: ./reports
        target: /app/reports
  grafana:
    container_name: grafana
    image: grafana/grafana
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_FEATURE_TOGGLES_ENABLE: "newInfluxDSConfigPageDesign"
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN must be exported before starting Grafana}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-kirchdorf}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-energy}
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
    depends_on:
      influxdb:
        condition: service_healthy
volumes:
  influxdb2-data:
  influxdb2-config:
  grafana-data:
